workflows:
  figcraft-android-arm64:
    name: FigCraft Android ARM64 Tablet APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
      vars:
        NDK_VERSION: "27.2.12479018"
        ANDROID_API: "29"
        CARGO_TERM_COLOR: "always"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "android-port"
          include: true
          source: true
    cache:
      cache_paths:
        - $HOME/.cargo/registry
        - $HOME/.cargo/git
        - $CM_BUILD_DIR/target
        - $HOME/.gradle/caches
    scripts:
      - name: Install Rust toolchain & aarch64-linux-android target
        script: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup update stable
          rustup target add aarch64-linux-android
          rustc --version
          cargo --version

      - name: Fetch craft-fonts & Pretendard Korean UI font
        script: |
          if [ ! -d "$CM_BUILD_DIR/.craft-fonts" ]; then
            git clone --depth 1 https://github.com/storytold/craft-fonts.git "$CM_BUILD_DIR/.craft-fonts"
          fi
          mkdir -p android/app/src/main/assets
          if [ ! -s android/app/src/main/assets/ui_font.otf ]; then
            curl -fsSL "https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard/dist/public/static/Pretendard-Medium.otf"               -o android/app/src/main/assets/ui_font.otf ||             curl -fsSL "https://raw.githubusercontent.com/fonts-archive/Pretendard/main/Pretendard-Medium.otf"               -o android/app/src/main/assets/ui_font.otf || true
          fi
          ls -lh android/app/src/main/assets/ || true

      - name: Ensure Android NDK & SDK Platform 35 (SIGPIPE-safe)
        script: |
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_DIR" -name sdkmanager -type f | head -n 1)"
          fi
          (yes || true) | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          (yes || true) | "$SDKMANAGER" \
            "ndk;${NDK_VERSION}" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Apply FigCraft Mobile wordmark branding
        script: |
          python3 - <<"EOF"
          from pathlib import Path
          for p in sorted(Path("crates/ui-egui/src").rglob("*.rs")):
              s = p.read_text(encoding="utf-8")
              idx = s.find("fn paint_wordmark")
              if idx == -1:
                  continue
              end = s.find("\n}", idx)
              if end == -1:
                  continue
              block = s[idx:end + 2]
              if '"Fig"' in block and '"Craft"' in block:
                  new_block = block.replace('"Fig"', '"FigCraft "', 1).replace('"Craft"', '"Mobile"', 1)
                  p.write_text(s[:idx] + new_block + s[end + 2:], encoding="utf-8")
                  print(f"Patched paint_wordmark in {p}: FigCraft (base) + Mobile (accent)")
                  break
          for p in sorted(Path("crates/text/src").rglob("*.rs")):
              s = p.read_text(encoding="utf-8")
              if '"/usr/share/fonts"' in s and '"/system/fonts"' not in s:
                  s = s.replace('"/usr/share/fonts"', '"/usr/share/fonts", "/system/fonts", "/product/fonts"')
                  p.write_text(s, encoding="utf-8")
                  print(f"Added Android /system/fonts to {p}")
          EOF

      - name: Run host unit tests (protocol, touch, mcp_http)
        script: |
          export PATH="$HOME/.cargo/bin:$PATH"
          export CRAFT_FONTS_DIR="$CM_BUILD_DIR/.craft-fonts"
          export FIGCRAFT_EMBED_CJK=1
          cargo test -p figcraft-android

      - name: Cross-compile libfigcraft_android.so & bundle libc++_shared.so
        script: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          NDK="$SDK_DIR/ndk/${NDK_VERSION}"
          HOST_TAG="linux-x86_64"
          if [ "$(uname -s)" = "Darwin" ]; then
            HOST_TAG="darwin-x86_64"
            if [ -d "$NDK/toolchains/llvm/prebuilt/darwin-arm64" ]; then HOST_TAG="darwin-arm64"; fi
          fi
          BIN="$NDK/toolchains/llvm/prebuilt/${HOST_TAG}/bin"
          SYSROOT_LIB="$NDK/toolchains/llvm/prebuilt/${HOST_TAG}/sysroot/usr/lib/aarch64-linux-android"

          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android${ANDROID_API}-clang"
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android${ANDROID_API}-clang"
          export CXX_aarch64_linux_android="$BIN/aarch64-linux-android${ANDROID_API}-clang++"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          export CRAFT_FONTS_DIR="$CM_BUILD_DIR/.craft-fonts"
          export FIGCRAFT_EMBED_CJK=1

          cargo build -p figcraft-android --lib --target aarch64-linux-android --release

          JNI_OUT="android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNI_OUT"
          cp target/aarch64-linux-android/release/libfigcraft_android.so "$JNI_OUT/"
          cp "$SYSROOT_LIB/libc++_shared.so" "$JNI_OUT/"
          ls -lh "$JNI_OUT"

      - name: Assemble Android ARM64 Debug APK
        script: |
          set -euo pipefail
          test -s android/app/src/main/jniLibs/arm64-v8a/libfigcraft_android.so
          test -s android/app/src/main/jniLibs/arm64-v8a/libc++_shared.so
          if ! command -v gradle >/dev/null 2>&1; then
            curl -sL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp/gradle
            export PATH="/tmp/gradle/gradle-8.10.2/bin:$PATH"
          fi
          gradle -p android :app:assembleDebug --stacktrace
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep "lib/arm64-v8a/libfigcraft_android.so"
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
