plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.storyteller.figcraft'
    compileSdk 35

    defaultConfig {
        applicationId "ai.storyteller.figcraft"
        minSdk 29
        targetSdk 35
        def cmBuild = (System.getenv("BUILD_NUMBER") ?: "1").toInteger()
        versionCode 180 + cmBuild
        versionName "0.18.1-android-v23-hotfix1." + cmBuild

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        debug {
            storeFile file("figcraft-debug.keystore")
            storePassword "figcraftdebug"
            keyAlias "figcraftdebug"
            keyPassword "figcraftdebug"
        }
    }

    buildTypes {
        debug {
            debuggable true
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    // Matched to android-activity 0.6.1 bundled GameActivity 4.4.0 glue
    implementation 'androidx.games:games-activity:4.4.0'
}
