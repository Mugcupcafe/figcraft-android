plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.storyteller.figcraft'
    compileSdk 35

    defaultConfig {
        applicationId "ai.storyteller.figcraft"
        minSdk 29
        targetSdk 35
        versionCode 181
        versionName "0.18.1-android-v6-hotfix"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildFeatures {
        prefab true
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    // Matched to android-activity 0.6 bundled GameActivity C++ glue
    implementation 'androidx.games:games-activity:2.0.2'
}
