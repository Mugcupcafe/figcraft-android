[package]
name = "figcraft-android"
version = "0.18.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Android ARM64 tablet app for FigCraft with GameActivity, offset mouse cursor, touch/stylus support, and embedded HTTP/SSE MCP server."

[lib]
name = "figcraft_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
figcraft-engine = { path = "../../crates/engine" }
figcraft-ui-egui = { path = "../../crates/ui-egui", default-features = false }
figcraft-text = { path = "../../crates/text" }

eframe = { version = "0.37", default-features = false, features = [
    "wgpu",
    "android-game-activity",
] }
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", features = ["game-activity"] }
android_logger = "0.15"
jni = "0.21"

# Android cdylib requires #[unsafe(no_mangle)] fn android_main and JNI FFI in platform.rs.
[lints.rust]
unsafe_code = "allow"
